<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Rocket Game (Demo)</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #1a1a2e; color: white; }
    .controls { margin: 20px 0; }
    button { padding: 12px 24px; font-size: 16px; cursor: pointer; background: #e94560; color: white; border: none; border-radius: 6px; }
    button:disabled { background: #555; cursor: not-allowed; }
    #multiplier { font-size: 36px; font-weight: bold; color: #ffd700; margin: 10px 0; }
    #status { margin-top: 15px; }
  </style>
</head>
<body>
  <h1>🚀 Rocket Demo (без ставок)</h1>
  <div id="multiplier">x1.00</div>
  <div class="controls">
    <button id="cashoutBtn" onclick="cashout()">Забрать выигрыш</button>
    <button id="resetBtn" onclick="startGame()" style="background:#00a8cc;">Начать заново</button>
  </div>
  <div id="status"></div>

  <script>
    let multiplier = 1.00;
    let interval;
    const crashPoint = 1 + Math.random() * 4; // случайная точка падения от x1.0 до x5.0
    let crashed = false;

    function updateMultiplier() {
      if (crashed) return;
      multiplier += 0.05;
      document.getElementById('multiplier').innerText = 'x' + multiplier.toFixed(2);
      // проверка падения
      if (multiplier >= crashPoint) {
        crashGame();
      }
    }

    function crashGame() {
      crashed = true;
      clearInterval(interval);
      document.getElementById('cashoutBtn').disabled = true;
      document.getElementById('status').innerText = "💥 Ракета упала! Выигрыш сгорел.";
      document.getElementById('status').style.color = "#e94560";
    }

    function cashout() {
      if (!crashed) {
        crashed = true;
        clearInterval(interval);
        document.getElementById('cashoutBtn').disabled = true;
        document.getElementById('status').innerText = "✅ Вы забрали выигрыш: x" + multiplier.toFixed(2);
        document.getElementById('status').style.color = "#00ff9d";
      }
    }

    function startGame() {
      crashed = false;
      multiplier = 1.00;
      crashPoint = 1 + Math.random() * 4;
      document.getElementById('multiplier').innerText = 'x1.00';
      document.getElementById('cashoutBtn').disabled = false;
      document.getElementById('status').innerText = "";
      interval = setInterval(updateMultiplier, 100); // каждые 100 мс множитель растёт
    }
  </script>
</body>
</html>
